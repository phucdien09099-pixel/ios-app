name: Build iOS App Test
on:
  push:
    branches: [ master, IOS-test ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # Cache cho Rust để tăng tốc độ build trên CI
      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Dependencies
        run: |
          npm install
          npm run build
          
      - name: Build Tauri iOS to APP File (Bypass Export Code 70)
        run: |
          # 1. Khởi tạo dự án iOS của Tauri
          npx tauri ios init --ci || true
          
          # 2. Tìm và thêm quyền bảo mật phần cứng vào Info.plist
          PLIST_TARGET=$(find src-tauri/gen/apple -name "Info.plist" | head -n 1)
          if [ -n "$PLIST_TARGET" ]; then
            echo "Đã tìm thấy Info.plist tại: $PLIST_TARGET"
            # Quyền Bluetooth & Camera 
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'App cần kết nối Bluetooth để điều khiển thiết bị.'" "$PLIST_TARGET" || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'App cần kết nối Bluetooth để quét thiết bị.'" "$PLIST_TARGET" || true
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'App cần sử dụng Camera để quét mã QR.'" "$PLIST_TARGET" || true
            
            # Xin quyền mạng nội bộ (Dùng cho Bluetooth hoặc Scan IP Local sau này)
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Ứng dụng cần quyền này để kết nối với Hub thông minh qua mạng nội bộ.'" "$PLIST_TARGET" || true
            
            # (ĐÃ XÓA PHẦN NSAppTransportSecurity BỞI VÌ WSS VÀ HTTPS ĐÃ AN TOÀN 100%)
          else
            echo "LỖI NẶNG: Không tìm thấy file Info.plist. Dừng build!"
            exit 1
          fi
          
          # 3. Ép cấu hình Manual Signing vào project.pbxproj để bypass tài khoản Apple Developer
          SED_TARGET=$(find src-tauri/gen/apple -name "project.pbxproj" | head -n 1)
          if [ -n "$SED_TARGET" ]; then
            echo "Đã tìm thấy file pbxproj tại: $SED_TARGET"
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$SED_TARGET"
            sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 0000000000;/g' "$SED_TARGET"
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$SED_TARGET"
            
            # Ép tắt kiểm tra chữ ký ở cấu hình build của Xcode
            sed -i '' '/buildSettings = {/a\
            CODE_SIGNING_ALLOWED = NO;\
            CODE_SIGNING_REQUIRED = NO;' "$SED_TARGET"
          fi
          
          # 4. CHẠY LỆNH BUILD NGUYÊN BẢN CỦA TAURI
          export TAURI_APPLE_DEVELOPMENT_TEAM="0000000000"
          export APPLE_DEVELOPMENT_TEAM="0000000000"
          
          npx tauri ios build --ci --archive-only
          
      - name: Pack APP into Zip for Sideloadly
        run: |
          mkdir -p build/Payload
          
          # Quét tìm file .app được xuất ra sau lệnh build
          APP_PATH=$(find $HOME/Library/Developer/Xcode/ -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n1)
          fi
          echo "Tìm thấy file App thành công tại: $APP_PATH"
          
          if [ -n "$APP_PATH" ]; then
            cp -a "$APP_PATH" build/Payload/
            cd build && zip -yr ../tauri-app-unsigned.ipa Payload
          else
            echo "Cảnh báo khẩn cấp: Không tìm thấy file .app!" && exit 1
          fi
          
      - name: Upload Artifact (Tải app về Windows)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-ios-app
          path: tauri-app-unsigned.ipa